name: AgriMart Fullstack Check

on:
  push:
    branches: [ "main" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./backend 
        run: npm install

      - name: Verify Backend Security
        working-directory: ./backend
        env:
          # These names must match your GitHub Secrets exactly!
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
        # Changed from server.js to index.js to match your repo
        run: node index.js --version 

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        # Added the flag to skip version conflicts
        run: npm install --legacy-peer-deps
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build